<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Noticias</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<header>

<nav>

<h1>Proyecto Final</h1>

<div>

<span id="usuario"></span>

<button id="logout">

Cerrar sesión

</button>

</div>

</nav>

</header>

<div id="adminPanel" style="display:none;">

<h2>Agregar Fuente</h2>

<input id="sourceName" placeholder="Nombre">

<input id="sourceUrl" placeholder="URL">

<input id="sourceDescription" placeholder="Descripción">

<input id="componentType" placeholder="Component Type">

<label>

<input type="checkbox" id="requiresSecret">

Requiere Secret

</label>

<input id="secretKeyName" placeholder="Secret Key Name">

<button id="btnFuente">

Agregar Fuente

</button>

<hr>

<a href="config.html" id="btnConfig" style="display:none; margin-top:20px;">

⚙️ Ir a Configuración de Admin

</a>

</div>

<div id="items">

</div>

<section id="trendingSection">

<div class="trending-header">

<h2>📊 Tendencias</h2>

<div class="trending-stats">

<span>Noticias analizadas: <strong id="totalItems">0</strong></span>

<span>Palabras clave: <strong id="totalKeywords">0</strong></span>

<span id="status">Cargando...</span>

</div>

<button id="refreshButton">🔄 Actualizar</button>

</div>

<div class="trending-grid">

<div>

<h3>Palabras clave más frecuentes</h3>

<div id="keywordsContainer"></div>

</div>

<div>

<h3>Sentimiento</h3>

<div id="sentimentContainer"></div>

</div>

</div>

</section>

<script src="js/api.js"></script>

<script src="js/auth.js"></script>

<script src="js/landing.js"></script>

<script src="js/trending.js"></script>

</body>

</html>
