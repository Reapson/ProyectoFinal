<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet" href="css/auth.css">

</head>

<body>

    <div class="container">

        <h1>Iniciar Sesión</h1>

        <input type="email" id="email" placeholder="Correo" required>

        <input type="password" id="password" placeholder="Contraseña" required>

        <button id="btnLogin">

            Ingresar

        </button>

        <br><br>

        <center>

            ¿No tienes cuenta?

            <a href="register.html">

                Registrarse

            </a>

        </center>

        <p id="mensaje" class="error"></p>

        <hr>

        <details style="margin-top: 20px; text-align: left; font-size: 12px; color: #666;">

            <summary style="cursor: pointer; font-weight: bold;">📌 Credenciales de prueba</summary>

            <div style="padding: 10px; background: #f0f0f0; border-radius: 5px; margin-top: 10px;">

                <p><strong>Email:</strong> admin@proyectofinal.com</p>

                <p><strong>Password:</strong> Admin123!</p>

                <p style="color: #999; font-size: 11px; margin-top: 10px;">

                    💡 Si no funciona, asegúrate de que:<br>

                    • El servidor esté corriendo (`dotnet run`)<br>

                    • Estés usando HTTPS (no HTTP)<br>

                    • Hayas esperado a que cargue completamente

                </p>

            </div>

        </details>

    </div>

    <script src="js/api.js"></script>

    <script src="js/auth.js"></script>

    <script src="js/login.js"></script>

</body>

</html>
