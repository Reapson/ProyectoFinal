<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Proyecto Final</title>
    <link rel="stylesheet" href="css/auth.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            padding: 60px 40px;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
            font-size: 50px;
        }

        h1 {
            text-align: center;
            color: #1f2937;
            margin-bottom: 10px;
            font-size: 32px;
            font-weight: 700;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 40px;
            font-size: 15px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            color: #374151;
            font-size: 15px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 16px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s ease;
            background: #f9fafb;
        }

        .form-group input:focus {
            background: white;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
            outline: none;
        }

        .btn-login {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 15px;
        }

        .btn-login:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-login:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .message {
            margin-top: 20px;
            padding: 15px 16px;
            border-radius: 10px;
            font-size: 15px;
            text-align: center;
            display: none;
        }

        .error {
            background-color: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .success {
            background-color: #dcfce7;
            color: #166534;
            border: 1px solid #bbf7d0;
        }

        .divider {
            margin: 30px 0;
            text-align: center;
            color: #9ca3af;
            font-size: 14px;
        }

        .register-link {
            text-align: center;
            margin-top: 25px;
            font-size: 15px;
            color: #6b7280;
        }

        .register-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .register-link a:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        .demo-credentials {
            background: #f3f4f6;
            border-left: 4px solid #667eea;
            padding: 15px 16px;
            border-radius: 8px;
            margin-top: 30px;
            font-size: 13px;
            line-height: 1.8;
            color: #374151;
        }

        .demo-credentials strong {
            color: #1f2937;
            display: block;
        }

        .demo-link {
            margin-top: 20px;
            text-align: center;
        }

        .demo-link a {
            display: inline-block;
            background: #f0f4ff;
            color: #667eea;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .demo-link a:hover {
            background: #667eea;
            color: white;
        }

        @media (max-width: 600px) {
            .card {
                padding: 40px 25px;
            }

            h1 {
                font-size: 26px;
            }

            .logo {
                font-size: 40px;
            }
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="card">
            <div class="logo">🔐</div>
            <h1>Bienvenido</h1>
            <p class="subtitle">Inicia sesión en tu cuenta</p>

            <form id="loginForm" onsubmit="return false;">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" placeholder="admin@proyectofinal.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="Tu contraseña" required>
                </div>

                <button type="button" id="btnLogin" class="btn-login">Ingresar</button>

                <div id="mensaje" class="message"></div>
            </form>

            <div class="divider">¿No tienes cuenta?</div>

            <div class="register-link">
                <a href="register.html">Crear una cuenta nueva</a>
            </div>

            <div class="demo-credentials">
                <strong>📌 Credenciales de prueba:</strong>
                Email: admin@proyectofinal.com<br>
                Contraseña: Admin123!
            </div>

            <div class="demo-link">
                <a href="index.html">⏭️ Saltar a la App (Demo sin login)</a>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>
</body>

</html>
